<!-- tailwind.html - a page made with Tailwind's in-browser compiler, as
     atariuptodate.de is (26 Nov 2026): EWeb doesn't run the compiler, and
     makes the sheet it would have written from the page's classes
     (src/browse/tw.c). Its dark bar, the green page, the white card with
     a table's header row in grey, the links in blue; md: rules held off
     below 768 pixels, and an Alpine.js :class's class made too. -->
<html lang=en><head><meta charset=utf-8><title>Tailwind</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>.nav-link{color:rgb(37 99 235);font-size:.875rem}</style>
</head>
<body class="bg-lime-700/30 text-gray-900">
<nav class="bg-gray-800 shadow text-white">
 <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-14">
  <a href="#"><span class="text-xl font-bold">Atari<span class="text-orange-600">UpToDate</span></span></a>
  <div class="hidden md:grid grid-cols-3 items-center"><a href="#">Software</a> <a href="#">Public Domain</a></div>
  <form class="md:hidden w-full max-w-xs"><input class="block w-full p-0.5 text-sm bg-gray-50 border border-gray-300" placeholder="Search"></form>
 </div>
</nav>
<main class="max-w-7xl mx-auto p-4">
 <h1 class="text-3xl font-bold mb-4">Welcome</h1>
 <p class="mb-4">A list of programs, styled by its classes alone.</p>
 <div class="bg-white rounded-lg shadow p-4 space-y-2">
  <h2 class="text-xl font-semibold">Updated</h2>
  <table class="w-full text-sm text-left border-collapse">
   <tr class="bg-gray-100"><th class="px-2 py-2">Name</th><th class="px-2 py-2">Version</th></tr>
   <tr class="border-t border-gray-200"><td class="px-2 py-2"><a class="nav-link" href="#">HighWire</a></td><td class="px-2 py-2">0.5.0</td></tr>
  </table>
  <button class="inline-flex items-center px-3 py-2 bg-gray-200" :class="{'rotate-90': open}">Menu</button>
 </div>
</main>
</body></html>

<!-- A checkbox and a radio button 13 CSS px square whatever the font's
     size, on the baseline, and a control's own margins on its line
     (webdriveruniversity.com's Dropdown, Checkboxes and Radio Buttons:
     labels of 18px, inputs margin-right 6px) -->
<html><head><meta charset=utf-8><title>Controls' margins</title><style>
body { font-family: sans-serif; background: #fff; margin: 8px }
label, input { font-size: 18px; margin: 0 20% 5% }
input[type=checkbox] { margin: 0 6px 0 0 }
.r input { margin: 0 6px 8px 0 }
</style></head><body>
<div><label><input type=checkbox>Option 1</label><br>
<label><input type=checkbox checked>Option 2</label></div>
<div class=r><input type=radio name=c checked>Green<br><input type=radio name=c>Blue</div>
<p>a<input type=checkbox style="margin-right:20px">b <input type=text size=3 style="margin-right:20px">c
<input type=radio style="margin:0 20px">d</p>
</body></html>

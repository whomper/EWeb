<html><head><title>Buttons of elements, controls made transparent</title>
<style>
:root { --border: #2a2a2a }
body { font: 13px sans-serif; margin: 8px; background: #0f0f0f; color: #eee }
/* Bootstrap's menu button (webdriveruniversity.com): three bars, its
   words for screen readers clipped away, the page's border, no ground */
.navbar-toggle { position: relative; float: right; padding: 9px 10px; margin: 8px 15px 8px 0;
                 background-color: transparent; background-image: none; border: 1px solid transparent }
html body .navbar-toggle { border-color: var(--border) !important; background-color: transparent !important }
.navbar-toggle .icon-bar { display: block; width: 22px; height: 2px; background: #ededed }
.navbar-toggle .icon-bar + .icon-bar { margin-top: 4px }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
           clip: rect(0, 0, 0, 0); border: 0 }
/* a button of a <b>, a border of the page's and no ground of its own:
   the button's own ground; one that is plain text: drawn as a control */
.b2 { border: 1px solid #f33; padding: 4px }
.b3 { border: 1px solid #2a2a2a }
/* fields made transparent by the page, with a border and without: the
   page shows through; one left alone keeps its own ground */
.tr { background: transparent; border: 1px solid #888; color: #eee }
.tn { background: transparent; color: #eee }
/* a button of elements as a block: as wide as its content, centred by
   its auto margins (Bootstrap's center-block) */
.cb { display: block; margin-left: auto; margin-right: auto; padding: 6px 12px; background: #333; color: #fff;
      border: 1px solid #888 }
/* border-box sizes: min-height and min-width are the border box's, as
   height and width are (webdriveruniversity.com's buttons of 52px) */
.mh { box-sizing: border-box; display: flex; align-items: center; justify-content: center; width: 70%;
      min-height: 52px; padding: 10px 16px; border: 1px solid #f45950 }
.mw { box-sizing: border-box; display: inline-block; min-width: 120px; padding: 0 20px; border: 2px solid #888 }
/* a button of words the page styles, left-aligned, its '+' floated
   right from an ::after (webdriveruniversity.com's accordion): laid out
   by its content, the '+' on the title's line; one that keeps its words
   centred and has no ::before or ::after: drawn as a control */
.acc { background-color: #2a2a2a; color: #ededed; padding: 18px; width: 100%; border: none;
       border-bottom: 1px solid #3a3a3a; text-align: left; font-size: 15px; font-weight: bolder }
.acc:after { content: '\002B'; color: #9a9a9a; font-weight: bold; float: right; margin-left: 5px }
.ctr { background-color: #2a2a2a; color: #ededed; padding: 8px; border: none }
</style></head><body>
<button type="button" class="navbar-toggle"><span class="sr-only">Toggle navigation</span><span
class="icon-bar"></span><span class="icon-bar"></span><span class="icon-bar"></span></button>
<p><button class="b2"><b>Find Out More!</b></button> <button class="b3">plain</button>
<button class="b2" style="background: #36c; color: #fff"><i>a ground</i> <b>of the page's</b></button>
<button class="cb"><b>Find Out More!</b></button>
<div class="mh" id="b1"><p style="margin: 0">CLICK ME!</p></div>
<p><span class="mw">min</span>
<button class="acc">Manual Testing</button>
<p><button class="ctr">centred, no ::after</button>
<p><input class="tr" value="see-through"> <input value="own ground"> <input class="tn" value="transparent, no border">
</body></html>

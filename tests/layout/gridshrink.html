<!-- yaary.music's software pages (Erez, 8 Nov 2026): a grid's minmax(0, 40px)
     columns at the card's width, the card's text inside it; and a picture
     whose width is a percentage, with a long alt text and no size yet,
     in a grid column of 140px: as wide as 75% of the column -->
<title>grid columns that shrink</title>
<style>
img { max-width: 100%; height: auto; display: block; }
.row { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 20px; align-items: center; }
.tile { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; margin: 0; background: #333;
        border: 1px solid #555; }
.tile img { width: 75%; }
.cards { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 20px; }
.card { display: grid; gap: 10px; align-content: start; padding: 22px; background: #ddd; }
.icons { display: grid; grid-template-columns: repeat(8, minmax(0, 40px)); gap: 6px; min-height: 32px; }
.icons img { width: 100%; height: auto; aspect-ratio: 1; }
</style>

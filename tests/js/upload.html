<!-- A file chosen for a page's file control (as webdriveruniversity.com's
     File Upload): its value as browsers give it, C:\fakepath\NAME, and
     its change event; the submit button's script told whether one is -->
<html><head><title>upload</title><script>
function fileSubmitted() {
  if (document.getElementById("myFile").value.length == 0)
    alert("You need to select a file to upload!");
  else
    alert("Your file has now been uploaded!");
}
</script></head><body>
<form onsubmit="return false">
<input type="file" id="myFile" name="filename" onchange="console.log('changed ' + this.value)">
<input type="submit" id="submit-button" onclick="fileSubmitted()">
</form></body></html>

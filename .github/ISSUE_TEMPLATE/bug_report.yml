name: Something doesn't work
description: Report a problem with EWeb's programs on your Atari
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The first line NSBENCH prints, or the release's number
      placeholder: "0.1"
    validations:
      required: true
  - type: dropdown
    id: program
    attributes:
      label: Which file
      options: ["NSBENCH.TTP"]
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: Atari and setup
      description: Machine, accelerator, RAM (ST and TT), TOS or MagiC/MiNT version, screen mode
      placeholder: "Falcon 030 with DFB1 at 50 MHz, 14 MB + 128 MB TT-RAM, TOS 4.04"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw. NSBENCH.LOG helps, and the page you tested if you can share it.
    validations:
      required: true

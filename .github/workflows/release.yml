name: Release

# Builds EWeb (make dist: what it needs, nothing else) and publishes it as a
# GitHub Release: its two packages, eweb-x.y.zip and eweb-x.y-firebee.zip. Two ways to start it:
# - Actions > Release > Run workflow, on main, with the notes: it tags
#   main's commit vX.Y, from VERSION;
# - push a tag vX.Y that matches VERSION: the tag's message
#   (git tag -a) is the notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notes:
        description: "What is new (Markdown): the release's notes"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Which release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat VERSION)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG=$GITHUB_REF_NAME
            if [ "$TAG" != "v$V" ]; then
              echo "::error::tag $TAG, but VERSION says $V"
              exit 1
            fi
          else
            TAG=v$V
            if [ "$GITHUB_REF_NAME" != main ]; then
              echo "::error::run it on main"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::$TAG is out already: tools/bump.py and commit first"
              exit 1
            fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Tools
        timeout-minutes: 10
        run: |
          # On 11 Nov 2026 the runners could not reach azure.archive.ubuntu.com or archive.ubuntu.com:
          # kernel.org's mirror, over https (EPlay's finding), and apt retries; on 13 Nov kernel.org was
          # unreachable in turn (EContact): three mirrors, the runner's apt takes the next that answers, IPv4
          # (AERA-Atari's template fa930c9)
          printf '%s\n' https://mirrors.edge.kernel.org/ubuntu http://azure.archive.ubuntu.com/ubuntu http://archive.ubuntu.com/ubuntu | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y gcc-m68k-linux-gnu gperf zip fonts-dejavu-core fonts-dejavu-extra \
            autoconf automake libtool gettext autopoint pkg-config
          python3 -m pip install --break-system-packages -r tools/requirements.txt
      - name: hcp, for the help file
        run: common/tools/build-hcp.sh "$RUNNER_TEMP/hcp"
      - name: Test
        run: make test
      - name: Build
        run: make dist HCP="$RUNNER_TEMP/hcp/hcp"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git fetch -q --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/notes.md"
          else
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          fi
          # the two packages (the guidelines' 7.4): the FireBee's uploaded
          # first, the standard one last (GitHub lists them by name, below)
          v=$(cat VERSION)
          std="dist/eweb-$v.zip" fb="dist/eweb-$v-firebee.zip"
          test -f "$std"
          if [ -f "$fb" ]; then
            gh release create "$TAG" "$fb" --target "$GITHUB_SHA" --title "${GITHUB_REPOSITORY#*/} $v" \
              --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" "$std"
          else
            gh release create "$TAG" "$std" --target "$GITHUB_SHA" --title "${GITHUB_REPOSITORY#*/} $v" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          # the list as GitHub's API gives it, unsorted: an EUpdate up to 2.14
          # unpacks the zips in that order and the last one wins; GitHub lists
          # them by name (the guidelines' 7.4, AERA-Atari b539163), so the
          # standard package must come last, before the release is announced
          order=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '[.assets[].name] | join(" ")')
          echo "assets: $order"
          want="eweb-$v.zip"
          [ -f "$fb" ] && want="eweb-$v-firebee.zip eweb-$v.zip"
          test "$order" = "$want" || { echo "the assets aren't as they must be, the standard zip last: $want"; exit 1; }

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          # On 11 Nov 2026 the runners could not reach azure.archive.ubuntu.com or archive.ubuntu.com:
          # kernel.org's mirror, over https (EPlay's finding, AERA-Atari's template 47a627e), and apt retries
          echo https://mirrors.edge.kernel.org/ubuntu | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y gperf fonts-dejavu-core fonts-dejavu-extra
          python3 -m pip install --break-system-packages -r tools/requirements.txt
      - name: make test
        run: make test

  atari:
    name: Atari build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The m68k cross compiler
        run: |
          # On 11 Nov 2026 the runners could not reach azure.archive.ubuntu.com or archive.ubuntu.com:
          # kernel.org's mirror, over https (EPlay's finding, AERA-Atari's template 47a627e), and apt retries
          echo https://mirrors.edge.kernel.org/ubuntu | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y gcc-m68k-linux-gnu gperf fonts-dejavu-core fonts-dejavu-extra
          python3 -m pip install --break-system-packages -r tools/requirements.txt
      - name: Build the programs
        run: make
      - name: The build changed no tracked file
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      # no artifact: only formal releases leave the build machine
